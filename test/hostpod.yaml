apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
spec:
  containers:
  - name: app
    image: busybox
    command: ["sleep", "3600"]
    volumeMounts:
    - name: host-logs
      mountPath: /host-logs
    - name: host-proc
      mountPath: /host-proc
  volumes:
  - name: host-logs
    hostPath:
      path: /var/log
      type: Directory
  - name: host-proc
    hostPath:
      path: /proc/self
      type: Directory
