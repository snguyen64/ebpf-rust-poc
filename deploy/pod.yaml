apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-rust-poc-pod
  namespace: kube-system
  labels:
    app: ebpf-rust-poc
spec:
  selector:
    matchLabels:
      app: ebpf-rust-poc
  template:
    spec:
      hostPID: true # Allow the container to see the host's PID namespace
      containers:
      - name: ebpf-rust-poc-container
        securityContext:
          privileged: true # Allow full access to the host's resources
        image: # TODO replace with Docker image name
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
        ports:
          - containerPort: 8080
        volumeMounts:
        - name: bpf
          mountPath: /sys/fs/bpf
        - name: cgroup
          mountPath: /sys/fs/cgroup
        - name: host-proc
          mountPath: /proc # Mount the host's /proc directory
      volumes:
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory