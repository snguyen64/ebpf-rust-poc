apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
spec:
  hostPID: true # Allow the container to see the host's PID namespace
  containers:
  - name: app
    image: busybox
    command: ["sleep", "3600"]
    securityContext:
      privileged: true # Allow full access to the host's resources
    volumeMounts:
    - name: host-logs
      mountPath: /host-logs
    - name: host-proc
      mountPath: /proc # Mount the host's /proc directory
  volumes:
  - name: host-logs
    hostPath:
      path: /var/log
      type: Directory
  - name: host-proc
    hostPath:
      path: /proc
      type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-malloc-free
spec:
  replicas: 3
  selector:
    matchLabels:
      app: test-malloc-free
  template:
    metadata:
      labels:
        app: test-malloc-free
    spec:
      containers:
      - name: test-malloc-free
        image: test-malloc-free:latest
        imagePullPolicy: Never