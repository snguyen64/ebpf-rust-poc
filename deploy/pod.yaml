apiVersion: v1
kind: Pod
metadata:
  name: ebpf-rust-poc-pod
  namespace: default
  labels:
    app: ebpf-rust-poc
spec:
  containers:
    - name: ebpf-rust-poc-container
      image: # TODO replace with Docker image name
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      resources:
        limits:
          memory: "256Mi"
          cpu: "500m"
      ports:
        - containerPort: 8080